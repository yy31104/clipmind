<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipMind</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="brand" id="home-btn">
      <span class="mark"></span>
      <span>ClipMind</span>
    </button>
    <div class="health" id="health"></div>
  </header>

  <!-- ───────────────── home ───────────────── -->
  <main class="view" id="view-home">
    <section class="hero">
      <h1>把短视频变成笔记</h1>
      <p class="sub">粘贴抖音分享文字，整段粘进来就行。多个链接会并行处理。</p>

      <div class="composer">
        <textarea id="input" rows="4" spellcheck="false"
          placeholder="4.66 g@b.nQ 09/22 ULJ:/ 傻*面试官为什么老是问我底层？ https://v.douyin.com/xxxx/ 复制此链接…"></textarea>
        <div class="composer-foot">
          <span class="hint" id="detected">等待粘贴</span>
          <button class="primary" id="analyze">分析</button>
        </div>
      </div>
      <p class="error" id="error" hidden></p>
    </section>

    <section class="board">
      <h2 class="section-label" id="active-label" hidden>正在处理</h2>
      <div class="stack" id="active"></div>

      <h2 class="section-label" id="library-label" hidden>笔记库</h2>
      <div class="grid" id="library"></div>

      <div class="empty" id="empty">
        <p>还没有笔记。上面粘贴一个链接开始。</p>
      </div>
    </section>
  </main>

  <!-- ───────────────── detail ───────────────── -->
  <main class="view" id="view-detail" hidden>
    <button class="back" id="back">← 返回</button>
    <h1 class="detail-title" id="d-title"></h1>
    <div class="meta" id="d-meta"></div>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="summary">摘要</button>
      <button class="tab" data-tab="frames">画面证据</button>
      <button class="tab" data-tab="transcript">转写</button>
    </nav>

    <section class="pane" id="pane-summary"></section>
    <section class="pane" id="pane-frames" hidden></section>
    <section class="pane" id="pane-transcript" hidden></section>
  </main>

</div>
<script src="/static/app.js"></script>
</body>
</html>
