name: release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  python-assets:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python scripts/build_release_assets.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: clipmind-${{ github.event.release.tag_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Attach assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
