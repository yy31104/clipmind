name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: node --check clipmind/web/app.js
      - run: python -m unittest discover -s tests -v
      - name: Labeled visual recall and redundancy gate
        run: python scripts/evaluate_visual_quality.py --output visual-quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-quality-${{ matrix.os }}
          path: visual-quality.json

  integration:
    # The byte-counting probe gates need yt-dlp, which the unit job omits on
    # purpose. They reach only a local HTTP server, so they belong in a job that
    # installs the tool rather than nowhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements-test.txt yt-dlp pytesseract
      - run: python -m unittest tests.test_probe tests.test_probe_transport tests.test_live_streams tests.test_xiaohongshu -v
      - name: Real decoder and image format contracts
        run: python -m unittest tests.test_upload_formats tests.test_multipage_tiff tests.test_remote_media_types -v
      - name: Offline local extraction smoke
        env:
          CLIPMIND_OUT: ${{ runner.temp }}/clipmind-smoke
          CLIPMIND_OCR_PROVIDER: tesseract
          CLIPMIND_TESSERACT_LANGUAGES: eng
          HF_HUB_OFFLINE: '1'
        run: python -m clipmind.cli demo --json

  lock-install:
    name: lock-install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Resolve the frozen environment on exactly this interpreter, not
      # whichever Python a runner image happens to put first.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          enable-cache: false
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -c "import clipmind, playwright"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python scripts/build_release_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
