name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: node --check clipmind/web/app.js
      - run: python -m unittest discover -s tests -v

  integration:
    # The byte-counting probe gates need yt-dlp, which the unit job omits on
    # purpose. They reach only a local HTTP server, so they belong in a job that
    # installs the tool rather than nowhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt yt-dlp
      - run: python -m unittest tests.test_probe tests.test_probe_transport tests.test_live_streams -v

  lock-install:
    name: lock-install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Resolve the frozen environment on exactly this interpreter, not
      # whichever Python a runner image happens to put first.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          enable-cache: false
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -c "import clipmind, playwright"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python scripts/build_release_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
