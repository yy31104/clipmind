name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt -r scripts/requirements-eval.txt
      - run: node --check clipmind/web/app.js
      - run: python -m unittest discover -s tests -v

  integration:
    # The byte-counting probe gates need yt-dlp, which the unit job omits on
    # purpose. They reach only a local HTTP server, so they belong in a job that
    # installs the tool rather than nowhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt yt-dlp
      - run: python -m unittest tests.test_probe tests.test_probe_transport tests.test_live_streams -v

  ocr-linux:
    # Run the actual decoder and OCR provider: import-only and stubbed unit
    # checks cannot catch unreadable generated slides.
    # Keep the OCR fixture gate on a fixed LTS; other Linux jobs track latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      CLIPMIND_OCR_PROVIDER: tesseract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-chi-tra
      - run: python -m pip install -r requirements-test.txt pytesseract
      - run: python scripts/evaluate_silent_slides.py --output linux-ocr-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ocr-evaluation
          path: linux-ocr-eval.json

  lock-install:
    name: lock-install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Resolve the frozen environment on exactly this interpreter, not
      # whichever Python a runner image happens to put first.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          enable-cache: false
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -c "import clipmind, playwright"
      - run: uv run --frozen python -m unittest tests.test_whisper_alignment -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python scripts/build_release_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  container-smoke:
    # Exercise the one-command Linux distribution before the release is tagged.
    # This needs neither model downloads nor registry write credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t clipmind-smoke .
      - run: docker run --rm --entrypoint clipmind clipmind-smoke doctor
      - name: Verify actual stdio initialization and tools
        run: |
          python - <<'PY'
          import json
          import subprocess

          messages = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
                  "protocolVersion": "2025-06-18", "capabilities": {},
                  "clientInfo": {"name": "release-smoke", "version": "1"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          result = subprocess.run(
              ["docker", "run", "--rm", "-i", "--entrypoint", "clipmind-mcp", "clipmind-smoke"],
              input="".join(json.dumps(message) + "\n" for message in messages),
              text=True, capture_output=True, timeout=60, check=True)
          replies = [json.loads(line) for line in result.stdout.splitlines()]
          assert replies[0]["result"]["serverInfo"]["name"] == "clipmind"
          names = {tool["name"] for tool in replies[1]["result"]["tools"]}
          assert names == {"clipmind." + name for name in (
              "extract_video", "get_transcript", "get_visual_timeline",
              "search_evidence", "get_frame", "export_pack")}
          print("Container CLI, dependency readiness and MCP transport passed")
          PY
