name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: node --check clipmind/web/app.js
      - run: python -m unittest discover -s tests -v

  integration:
    # The byte-counting probe gates need yt-dlp, which the unit job omits on
    # purpose. They reach only a local HTTP server, so they belong in a job that
    # installs the tool rather than nowhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt yt-dlp
      - run: python -m unittest tests.test_probe tests.test_probe_transport tests.test_live_streams -v

  ocr-linux:
    # Run the actual decoder and OCR provider: import-only and stubbed unit
    # checks cannot catch unreadable generated slides.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: "1"
      CLIPMIND_OCR_PROVIDER: tesseract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-chi-tra
      - run: python -m pip install -r requirements-test.txt pytesseract
      - run: python scripts/evaluate_silent_slides.py --output linux-ocr-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ocr-evaluation
          path: linux-ocr-eval.json

  lock-install:
    name: lock-install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Resolve the frozen environment on exactly this interpreter, not
      # whichever Python a runner image happens to put first.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          enable-cache: false
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -c "import clipmind, playwright"
      - run: uv run --frozen python -m unittest tests.test_whisper_alignment -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python scripts/build_release_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
