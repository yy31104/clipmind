name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: node --check clipmind/web/app.js
      - run: python -m unittest discover -s tests -v

  integration:
    # The byte-counting probe gates need yt-dlp, which the unit job omits on
    # purpose. They reach only a local HTTP server, so they belong in a job that
    # installs the tool rather than nowhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt yt-dlp
      - run: python -m unittest tests.test_probe -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python scripts/build_release_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
